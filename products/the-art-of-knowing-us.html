  {

  </div>

// ── INSTRUCTIONS ─────────────────────────────────
html += `<div class="card" data-group="intro">
  <div class="card-border" style="border-color:#C8C0B8"></div>
  ${orns('#C8C0B8')}
  <div class="card-layout">
    <div class="instr-wrap">
      <div class="sect-eyebrow">How to play</div>
      <div class="instr-title">There are no<br/><em>wrong</em><br/>answers.</div>
      <div class="thin-rule"></div>
      <div class="body-text">Shuffle the cards. Pick one at random or choose the category that feels right for this moment.<br/><br/>Read the question out loud. Answer honestly. Listen without interrupting or judging.<br/><br/>Give each answer space before moving on to the next card. The best conversations don't rush.</div>
      <div class="thin-rule"></div>
      <div class="lvl-section-label">The three levels</div>
      <div class="lrow"><div class="lnum">01</div><div><div class="lname">Surface</div><div class="ldesc">To warm up and get started.</div></div></div>
      <div class="lrow"><div class="lnum">02</div><div><div class="lname">Deep</div><div class="ldesc">To go further. Things get real.</div></div></div>
      <div class="lrow"><div class="lnum">03</div><div><div class="lname">Soul</div><div class="ldesc">For the brave. The questions that change something.</div></div></div>
      <div class="footer-label">4 categories · 52 questions · 1 real conversation</div>
    </div>
    <div class="color-bar">${stripes}</div>
  </div>
</div>`;

// ── COLOR LEGEND ─────────────────────────────────
html += `<div class="card" data-group="intro">
  <div class="card-border" style="border-color:#C8C0B8"></div>
  ${orns('#C8C0B8')}
  <div class="card-layout">
    <div class="instr-wrap" style="gap:0">
      <div class="sect-eyebrow" style="margin-bottom:0.09in">Color guide</div>
      <div class="instr-title" style="font-size:14pt;margin-bottom:0.13in">What does<br/><em>each color mean?</em></div>
      <div class="thin-rule"></div>
      ${Object.values(cats).map(c => `
        <div style="display:flex;align-items:flex-start;gap:11px;margin-bottom:0.14in">
          <div style="width:0.22in;height:0.22in;background:${c.color};border-radius:50%;flex-shrink:0;margin-top:2px"></div>
          <div>
            <div style="font-size:9pt;font-weight:700;color:#1E1812;margin-bottom:2px">${c.label}</div>
            <div style="font-family:Inter,sans-serif;font-size:6.5pt;color:#5A504A;line-height:1.5">${
              c.label === 'Friends' ? 'The people we choose to be witnesses of our lives.' :
              c.label === 'Family' ? 'The bonds that shape us, even when we don\'t choose them.' :
              c.label === 'Partner' ? 'The closest mirror and the space where we grow the most.' :
              'The longest relationship of your life — and the most neglected.'
            }</div>
          </div>
        </div>`).join('')}
      <div class="thin-rule" style="margin-top:auto"></div>
      <div class="footer-label">Levels: 01 Surface · 02 Deep · 03 Soul</div>
    </div>
    <div class="color-bar">${stripes}</div>
  </div>
</div>`;

// ── CATEGORIES + CARDS ────────────────────────────
catData.forEach(cat => {
  const c = cats[cat.id];

  html += `<div class="card" data-group="${cat.id}">
    <div class="card-border" style="border-color:${c.borderC}"></div>
    ${orns(c.ornC)}
    <div class="card-layout">
      <div class="cat-head" style="background:${c.color};height:1.55in">
        <div class="cat-circle" style="width:3in;height:3in;top:-1.5in;right:-1.5in"></div>
        <div class="cat-circle" style="width:1.2in;height:1.2in;bottom:-0.4in;left:0.1in"></div>
        <div class="cat-num">${c.num} / ${c.label}</div>
        <div class="cat-name-big"><em>${c.label}</em></div>
      </div>
      <div class="cat-body-area">
        <div>
          <div class="why-label" style="color:${c.color}">Why does it matter?</div>
          <div class="why-text">${cat.why}</div>
        </div>
        <div class="cat-count-label">13 questions · 3 levels</div>
      </div>
    </div>
  </div>`;

  cat.cards.forEach(card => {
    const hh = card.level === 1 ? '0.68in' : card.level === 2 ? '0.78in' : '0.88in';
    html += `<div class="card" data-group="${cat.id}">
      <div class="card-border" style="border-color:${c.borderC}"></div>
      ${orns(c.ornC)}
      <div class="card-layout">
        <div class="q-head-strip" style="background:${c.color};height:${hh}">
          <div class="q-label">${c.label}</div>
          <div class="q-lvl-tag">0${card.level} · ${lvlNames[card.level]}</div>
        </div>
        <div class="q-body-area">
          <div class="q-question">${card.q}</div>
          <div class="insight-block">
            <div class="insight-header">
              <div class="insight-concept" style="color:${c.color}">${card.concept}</div>
              <div class="insight-author">— ${card.author}</div>
            </div>
            <div class="insight-text">${card.psych}</div>
          </div>
        </div>
      </div>
    </div>`;
  });
});

// ── CARD BACK ─────────────────────────────────────
html += `<div class="card" data-group="outro">
  <div class="card-border" style="border-color:#C8C0B8"></div>
  ${orns('#C8C0B8')}
  <div class="back-dots"></div>
  <div class="back-center-box">
    <div class="back-name">The Art of<br/><em>Knowing Us</em></div>
    <div class="back-thin-rule"></div>
    <div class="back-by">Alana · By Ana Llanos</div>
  </div>
  <div class="color-bar" style="position:absolute;bottom:0.13in;left:0.13in;right:0.13in;height:0.1in">${stripes}</div>
</div>`;

// ── CLOSING ───────────────────────────────────────
html += `<div class="card" data-group="outro">
  <div class="card-border" style="border-color:#C8C0B8"></div>
  ${orns('#C8C0B8')}
  <div class="card-layout">
    <div class="closing-main">
      <div class="h-rule"></div>
      <div class="closing-quote">"Knowing each other<br/>is the most<br/>underrated act of love."</div>
      <div class="closing-attr">— Alana</div>
      <div class="h-rule"></div>
      <div class="cover-byline">Alana · By Ana Llanos</div>
    </div>
    <div class="color-bar">${stripes}</div>
  </div>
</div>`;

document.getElementById('app').innerHTML = html;
const app = document.getElementById('app');
const allCards = Array.from(app.querySelectorAll('.card'));
app.innerHTML = '';

// Group cards by data-group, preserving order
const groups = {};
const groupOrder = [];
allCards.forEach(card => {
  const g = card.dataset.group || 'misc';
  if (!groups[g]) { groups[g] = []; groupOrder.push(g); }
  groups[g].push(card);
});

const sheetStyle = 'width:8.5in;height:11in;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:0.12in;padding:0.2in;page-break-after:always;break-after:page;background:#E8E3DC;box-sizing:border-box;overflow:hidden';

groupOrder.forEach(gName => {
  const cards = groups[gName];
  // Pad group to next multiple of 4 so no page mixes categories
  const padded = [...cards];
  while (padded.length % 4 !== 0) padded.push(null);

  for (let i = 0; i < padded.length; i += 4) {
    const sheet = document.createElement('div');
    sheet.style.cssText = sheetStyle;
    for (let j = 0; j < 4; j++) {
      if (padded[i + j]) {
        sheet.appendChild(padded[i + j]);
      } else {
        const empty = document.createElement('div');
        empty.style.cssText = 'width:100%;height:100%;background:#E8E3DC';
        sheet.appendChild(empty);
      }
    }
    app.appendChild(sheet);
  }
});
</script>
</body>
</html>
