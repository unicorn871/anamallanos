  },
  {
    id: 'contigo',
    why: `La psicología humanista pone la autoconciencia como base del crecimiento. La relación con una misma es la más larga de todas — y la más descuidada. Conocerse con honestidad y sin juicio lo cambia todo.`,
    cards: [
      { level:1, q:'¿Qué es lo que más te gusta de ti?',

      { level:1, q:'¿Cuál ha sido tu mayor logro que casi nadie conoce?',
        concept:'Logros internos', author:'Carol Dweck',
        psych:'Los logros externos son visibles; los internos —superar un miedo, cambiar un patrón— son los más transformadores. Nombrarlos los hace reales.' },
      { level:1, q:'¿Qué actividad te hace perder la noción del tiempo?',
        concept:'Estado de flujo', author:'Csikszentmihalyi',

      { level:1, q:'¿Qué frase te describe mejor en este momento de tu vida?',
        concept:'Narrativa de identidad', author:'Dan McAdams',

        concept:'Identidades no integradas', author:'Carl Gustav Jung',

      { level:2, q:'¿Cuándo fue la última vez que te priorizaste sin sentirte culpable?',
        concept:'Culpa condicionada', author:'Harriet Lerner',

        concept:'Integración de la sombra', author:'Carl Gustav Jung',
        psych:'Lo que más nos cuesta aceptar suele consumir más energía psíquica. Aceptarlo no significa aprobarlo — significa dejar de gastar energía en negarlo.' },

const lvlNames = ['','SUPERFICIE','PROFUNDO','ALMA'];

    <div class="orn bl" style="border-color:${c}"></div>
    <div class="orn br" style="border-color:${c}"></div>
  `;
}

const stripes = Object.values(cats).map(c=>`<div style="background:${c.color}"></div>`).join('');

let html = '';

html += `<div class="card" data-group="intro">
  <div class="card-border" style="border-color:#C8C0B8"></div>

      <div class="thin-rule"></div>
      <div class="lvl-section-label">Los tres niveles</div>
      <div class="lrow"><div class="lnum">01</div><div><div class="lname">Superficie</div><div class="ldesc">Para romper el hielo y entrar en calor.</div></div></div>
      <div class="lrow"><div class="lnum">02</div><div><div class="lname">Profundo</div><div class="ldesc">Para ir más adentro. Se pone real.</div></div></div>
      <div class="lrow"><div class="lnum">03</div><div><div class="lname">Alma</div><div class="ldesc">Para los valientes. Las preguntas que cambian algo.</div></div></div>
      <div class="footer-label">4 categorías · 52 preguntas · 1 conversación real</div>
    </div>
    <div class="color-bar">${stripes}</div>
  </div>
</div>`;

// ── COLOR LEGEND ─────────────────────────────────
html += `<div class="card" data-group="intro">
  <div class="card-border" style="border-color:#C8C0B8"></div>
  ${orns('#C8C0B8')}
  <div class="card-layout">
    <div class="instr-wrap" style="gap:0">
      <div class="sect-eyebrow" style="margin-bottom:0.09in">Guía de colores</div>
      <div class="instr-title" style="font-size:14pt;margin-bottom:0.13in">¿Qué significa<br/><em>cada color?</em></div>
      <div class="thin-rule"></div>
      ${Object.values(cats).map(c => `
        <div style="display:flex;align-items:flex-start;gap:11px;margin-bottom:0.14in">
          <div style="width:0.22in;height:0.22in;background:${c.color};border-radius:50%;flex-shrink:0;margin-top:2px"></div>

              c.label === 'Amigos' ? 'Las personas que elegimos para ser testigos de nuestra vida.' :
              c.label === 'Familia' ? 'Los vínculos que nos forman, aunque no siempre los elijamos.' :
              c.label === 'Pareja' ? 'El espejo más cercano y el espacio donde más crecemos.' :
              'La relación más larga — y la más descuidada — de todas.'

          </div>
        </div>`).join('')}
      <div class="thin-rule" style="margin-top:auto"></div>
      <div class="footer-label">Los tres niveles: 01 Superficie · 02 Profundo · 03 Alma</div>
    </div>
    <div class="color-bar">${stripes}</div>

// ── CATEGORIES + CARDS ────────────────────────────
catData.forEach(cat => {
  const c = cats[cat.id];

  html += `<div class="card" data-group="${cat.id}">
    <div class="card-border" style="border-color:${c.borderC}"></div>
    ${orns(c.ornC)}
    <div class="card-layout">
      <div class="cat-head" style="background:${c.color};height:1.55in">
        <div class="cat-circle" style="width:3in;height:3in;top:-1.5in;right:-1.5in"></div>
        <div class="cat-circle" style="width:1.2in;height:1.2in;bottom:-0.4in;left:0.1in"></div>
        <div class="cat-num">${c.num} / ${c.label}</div>
        <div class="cat-name-big"><em>${c.label}</em></div>
      </div>
      <div class="cat-body-area">
        <div>
          <div class="why-label" style="color:${c.color}">¿Por qué importa?</div>
          <div class="why-text">${cat.why}</div>
        </div>
        <div class="cat-count-label">13 preguntas · 3 niveles</div>
      </div>
    </div>
  </div>`;

  cat.cards.forEach(card => {
    const hh = card.level === 1 ? '0.68in' : card.level === 2 ? '0.78in' : '0.88in';

      <div class="card-border" style="border-color:${c.borderC}"></div>
      ${orns(c.ornC)}

          <div class="insight-block">

  ${orns('#C8C0B8')}
  <div class="card-layout">

      <div class="h-rule"></div>

document.getElementById('app').innerHTML = html;
const app = document.getElementById('app');
const allCards = Array.from(app.querySelectorAll('.card'));
app.innerHTML = '';

// Group cards by data-group, preserving order
const groups = {};
const groupOrder = [];
allCards.forEach(card => {
  const g = card.dataset.group || 'misc';
  if (!groups[g]) { groups[g] = []; groupOrder.push(g); }
  groups[g].push(card);
});

const sheetStyle = 'width:8.5in;height:11in;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:0.12in;padding:0.2in;page-break-after:always;break-after:page;background:#E8E3DC;box-sizing:border-box;overflow:hidden';

groupOrder.forEach(gName => {
  const cards = groups[gName];
  // Pad group to next multiple of 4 so no page mixes categories
  const padded = [...cards];
  while (padded.length % 4 !== 0) padded.push(null);

  for (let i = 0; i < padded.length; i += 4) {
    const sheet = document.createElement('div');
    sheet.style.cssText = sheetStyle;
    for (let j = 0; j < 4; j++) {
      if (padded[i + j]) {
        sheet.appendChild(padded[i + j]);
      } else {
        const empty = document.createElement('div');
        empty.style.cssText = 'width:100%;height:100%;background:#E8E3DC';
        sheet.appendChild(empty);
      }
    }
    app.appendChild(sheet);
  }
});
